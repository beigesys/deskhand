name: Server and web app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: API tests, web typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Web app
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-server-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-server-
      # The server alone: the agent needs the native codec build (see windows.yml).
      - name: Server tests
        run: cargo test --locked -p deskhand-server
