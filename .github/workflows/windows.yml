name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Static deskhand-agent.exe and deskhand-server.exe
    runs-on: windows-latest
    env:
      # Static libvpx and Opus (vcpkg) and OpenH264 (built by its crate) with the static
      # C runtime (+crt-static in
      # .cargo/config.toml), so the .exe files need no vcruntime140.dll or anything else.
      VCPKGRS_TRIPLET: x64-windows-static
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-cache,readwrite
      # bindgen (vpx headers) needs libclang; the runner image has LLVM here.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-x64-windows-static-libvpx-opus-v1
      - name: Native libraries (vcpkg) and esbuild
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
          vcpkg install libvpx opus --triplet $env:VCPKGRS_TRIPLET
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          npm install -g esbuild
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-static-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-static-
      - name: Build
        run: cargo build --release --locked --target ${{ env.TARGET }} -p deskhand-agent -p deskhand-server
      # Fails if either .exe imports a DLL that doesn't come with Windows: the C/C++
      # runtimes (vcruntime, msvcp, ucrtbase, api-ms-win-crt-*) or any codec library.
      - name: Check imports are Windows-only
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe |
            Where-Object FullName -like '*Hostx64\x64*' | Select-Object -First 1
          $deny = '^(vcruntime|msvcp|ucrtbase|concrt|vccorlib|api-ms-win-crt-|vpx|libvpx|opus|libopus|openh264|libgcc|libstdc|libwinpthread)'
          $bad = $false
          foreach ($exe in 'deskhand-agent.exe', 'deskhand-server.exe') {
            $path = "target\$env:TARGET\release\$exe"
            $dlls = & $dumpbin.FullName /nologo /dependents $path |
              ForEach-Object { $_.Trim() } | Where-Object { $_ -match '\.dll$' }
            Write-Output "$exe imports: $($dlls -join ', ')"
            foreach ($d in $dlls) {
              $l = $d.ToLower()
              # API sets (api-ms-win-core-*) resolve inside Windows and have no file.
              $system = $l.StartsWith('api-ms-win-') -or $l.StartsWith('ext-ms-win-') -or
                (Test-Path "$env:SystemRoot\System32\$d")
              if ($l -match $deny -or -not $system) {
                Write-Output "FAIL ${exe}: $d is not part of Windows"
                $bad = $true
              }
            }
          }
          if ($bad) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: deskhand-windows-x64
          path: |
            target/x86_64-pc-windows-msvc/release/deskhand-agent.exe
            target/x86_64-pc-windows-msvc/release/deskhand-server.exe
