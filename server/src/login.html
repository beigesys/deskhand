<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deskhand sign in</title>
<style>
:root { color-scheme: light dark; --bg: #f6f7f9; --fg: #111; --muted: #6b7280; --card: #fff; --line: #d8dbe0; --accent: #2563eb; }
@media (prefers-color-scheme: dark) { :root { --bg: #111317; --fg: #e8eaed; --muted: #9aa0a6; --card: #1a1d23; --line: #2c313a; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 15px system-ui, sans-serif; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 24px; width: min(320px, calc(100vw - 32px)); box-sizing: border-box; }
h1 { font-size: 18px; margin: 0 0 16px; }
input, button, .sso { display: block; width: 100%; box-sizing: border-box; padding: 10px; border-radius: 6px; font: inherit; text-align: center; }
input { border: 1px solid var(--line); background: var(--bg); color: var(--fg); margin-bottom: 12px; text-align: left; }
button { border: 0; background: var(--accent); color: #fff; cursor: pointer; }
.sso { border: 1px solid var(--line); color: var(--fg); text-decoration: none; margin-bottom: 8px; }
.sso:hover { border-color: var(--muted); }
.or { color: var(--muted); font-size: 13px; text-align: center; margin: 12px 0; }
.bad { color: #dc2626; font-size: 13px; margin: 0 0 12px; display: none; }
</style>
</head>
<body>
<div class="card">
<h1>Deskhand</h1>
<p class="bad" id="bad">Wrong user name or password.</p>
<p class="bad" id="slow">Too many attempts. Wait a minute.</p>
{{sso}}
{{password}}
</div>
<script>for (const k of ['bad', 'slow']) if (location.search.includes(k)) document.getElementById(k).style.display = 'block';</script>
</body>
</html>
