<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ithub setup</title>
<style>
:root { color-scheme: light dark; --bg: #f6f7f9; --fg: #111; --muted: #6b7280; --card: #fff; --line: #d8dbe0; --accent: #2563eb; }
@media (prefers-color-scheme: dark) { :root { --bg: #111317; --fg: #e8eaed; --muted: #9aa0a6; --card: #1a1d23; --line: #2c313a; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 15px system-ui, sans-serif; }
form { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 24px; width: min(340px, calc(100vw - 32px)); box-sizing: border-box; }
h1 { font-size: 18px; margin: 0 0 8px; } p { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
input, button { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 6px; font: inherit; }
input { border: 1px solid var(--line); background: var(--bg); color: var(--fg); margin-bottom: 12px; }
button { border: 0; background: var(--accent); color: #fff; cursor: pointer; }
</style>
</head>
<body>
<form method="post" action="/setup">
<h1>Set up ithub</h1>
<p>Create the first admin. The setup token is in the link the server printed.</p>
<input name="token" placeholder="Setup token" value="{{token}}" required>
<input name="username" placeholder="Admin user name" value="admin" required autocomplete="username">
<input type="password" name="password" placeholder="Password (8+ characters)" minlength="8" required autocomplete="new-password">
<button>Create admin</button>
</form>
</body>
</html>
