<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="15">
<title>ithub devices</title>
<style>
:root { color-scheme: light dark; --bg: #f6f7f9; --fg: #111; --muted: #6b7280; --card: #fff; --line: #d8dbe0; --ok: #16a34a; }
@media (prefers-color-scheme: dark) { :root { --bg: #111317; --fg: #e8eaed; --muted: #9aa0a6; --card: #1a1d23; --line: #2c313a; } }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px system-ui, sans-serif; }
header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
header h1 { font-size: 18px; margin: 0; }
header button { background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 6px 10px; cursor: pointer; font: inherit; }
main { max-width: 800px; margin: 0 auto; padding: 16px; display: grid; gap: 8px; }
.dev { display: grid; grid-template-columns: 10px 1fr auto auto auto; gap: 12px; align-items: center; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; color: inherit; text-decoration: none; }
.acts { display: flex; gap: 6px; }
.acts a { color: var(--fg); text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; font-size: 13px; }
.acts a:hover { border-color: var(--muted); }
.dev > span:not(.dot):not(.acts) { color: var(--muted); font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.empty { color: var(--muted); }
@media (max-width: 560px) { .dev { grid-template-columns: 10px 1fr auto; } .dev > span:nth-of-type(2), .dev > span:nth-of-type(3) { display: none; } }
</style>
</head>
<body>
<header><h1>ithub</h1><form method="post" action="/logout"><button>Sign out</button></form></header>
<main>{{devices}}</main>
</body>
</html>
