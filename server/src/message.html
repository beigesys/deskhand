<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ithub {{title}}</title>
<style>
:root { color-scheme: light dark; --bg: #f6f7f9; --fg: #111; --muted: #6b7280; --card: #fff; --line: #d8dbe0; --accent: #2563eb; }
@media (prefers-color-scheme: dark) { :root { --bg: #111317; --fg: #e8eaed; --muted: #9aa0a6; --card: #1a1d23; --line: #2c313a; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 15px system-ui, sans-serif; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 24px; width: min(380px, calc(100vw - 32px)); box-sizing: border-box; }
h1 { font-size: 18px; margin: 0 0 12px; } p { margin: 0 0 12px; line-height: 1.4; } a { color: var(--accent); }
</style>
</head>
<body>
<div class="card"><h1>{{title}}</h1>{{body}}<p><a href="/login">Back to sign in</a></p></div>
</body>
</html>
