[package]
name = "ithub-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ithub-agent"
path = "src/main.rs"

[dependencies]
ithub-proto = { path = "../proto" }
voxl = { package = "voxl-server", path = "../vendor/voxl" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
getrandom = "0.3"
hex = "0.4"
dirs = "6"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
portable-pty = "0.9"
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk", "network", "user"] }

[target.'cfg(windows)'.dependencies]
wmi = "0.18"
winreg = "0.56"
windows = { version = "0.62", features = ["Win32_System_RemoteDesktop", "Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Shutdown", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
